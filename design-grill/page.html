<!doctype html>
<html lang="ru" data-theme="__GRILL_THEME__">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Грил</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@700&display=swap" />
<style>
  :root {
    color-scheme: dark;
    --page: #09090a; --paper: #131315; --card: #1a1a1d; --card-hover: #212125; --chip: #222226; --line: #2a2a2f;
    --text: #f1f1ed; --soft: #b5b5b0; --muted: #8c8d8b; --blue: #8fa4ff; --lime: #d7ff00; --lime-hover: #e6ff4d;
    --lime-soft: #d7ff0014; --lime-line: #d7ff0066; --warn: #ffb38a; --poor: #ff8f73;
    --sans: "Golos Text", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --display: "Unbounded", "Golos Text", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--sans); font-size: 16px; line-height: 1.55; color: var(--text); background: var(--page);
    display: grid; grid-template-rows: auto auto 1fr auto; grid-template-columns: 240px minmax(0, 1fr) 32vw; height: 100vh;
  }
  a { color: var(--blue); }
  #banner { grid-row: 1; grid-column: 1 / -1; display: none; padding: 10px 28px; font-size: 14px; background: #2a1812; color: var(--warn); }
  #banner.show { display: block; } #banner.done { background: var(--lime-soft); color: var(--lime); }

  header { grid-row: 2; grid-column: 1 / -1; display: flex; align-items: center; gap: 10px 14px; padding: 18px 28px; position: relative; }
  header h1 { font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: -.02em; margin: 0; }
  header .path, #intent, #levels-toggle, #levels, #subagent-opt, #theme-toggle, .info { display: none !important; }
  header .status { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--lime); }
  .dot.working { background: var(--blue); animation: pulse 1.2s ease-in-out infinite; }
  .dot.gone { background: var(--muted); }
  .dot.unheard { background: transparent; box-shadow: inset 0 0 0 1.5px var(--warn); }
  @keyframes pulse { 50% { opacity: .3; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { display: inline-block; width: 11px; height: 11px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -1px; flex-shrink: 0; }
  #progress { display: none; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; overflow: hidden; }
  header.working #progress { display: block; }
  #progress::after { content: ""; position: absolute; top: 0; bottom: 0; width: 30%; background: var(--blue); animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { from { left: -30%; } to { left: 100%; } }
  #terms-toggle, #visualize { font-size: 14px; padding: 6px 14px; min-height: 0; }
  #visualize .spin { width: 9px; height: 9px; margin-right: 4px; }
  #terms { display: none; position: absolute; right: 28px; top: 100%; width: 420px; max-height: 60vh; overflow-y: auto; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 8px 20px; z-index: 5; box-shadow: 0 22px 40px -26px #000c; }
  #terms.show { display: block; }
  .term { padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 15px; color: var(--soft); } .term:last-child { border-bottom: 0; }
  .term b { color: var(--text); font-weight: 600; } .term .avoid { color: var(--muted); font-size: 13px; }

  nav { grid-row: 3; grid-column: 1; overflow-y: auto; padding: 4px 0 24px; }
  nav .note { margin: 6px 16px 8px; padding: 12px 14px; background: var(--card); border-radius: 14px; font-size: 14px; color: var(--soft); }
  nav .round { padding: 18px 24px 6px; font-size: 13px; color: var(--muted); }
  nav .round span + span { display: none; }
  .item { display: grid; grid-template-columns: 24px 1fr auto; gap: 0 8px; align-items: baseline; margin: 0 10px; padding: 9px 14px; border-radius: 12px; cursor: pointer; color: var(--soft); }
  .item:hover { background: var(--chip); }
  .item.selected { background: var(--card); color: var(--text); }
  .item .id { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .item .t { font-size: 15px; line-height: 1.35; }
  .item .sword { display: none; }
  .item .mark { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
  .item .mark svg { width: 14px; height: 14px; }
  .mark.answered { color: var(--lime); } .mark.open, .mark.reopened { font-size: 0; } .mark.staged, .mark.pending { color: var(--lime); }
  .item.updated .t::after { content: "•"; color: var(--blue); margin-left: 6px; }
  nav .empty { padding: 20px 24px; font-size: 14px; color: var(--muted); }

  #visual { grid-row: 3; grid-column: 1 / 3; display: none; grid-template-rows: auto 1fr; min-height: 0; margin: 0 0 0 16px; background: var(--paper); border-radius: 24px; overflow: hidden; }
  body.visualize #visual { display: grid; } body.visualize nav, body.visualize main { display: none; }
  #visual-strip { display: flex; align-items: center; gap: 14px; padding: 12px 24px; font-size: 14px; color: var(--muted); }
  #visual-strip .kind { color: var(--text); font-weight: 600; }
  #visual-strip .ver b { color: var(--soft); font-weight: 500; }
  #visual-stale { color: var(--warn); font-size: 13px; }
  #visual-strip .right { margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--blue); }
  #visual-strip a { color: var(--soft); text-decoration: none; } #visual-strip a:hover { color: var(--lime); }
  #visual-frame { width: 100%; height: 100%; border: 0; background: #fff; display: block; }
  #visual-wait { display: flex; align-items: center; justify-content: center; gap: 10px; height: 100%; color: var(--muted); font-size: 15px; }
  #visual-wait[hidden], #visual-frame[hidden] { display: none; }

  main { grid-row: 3; grid-column: 2; overflow-y: auto; padding: 44px 52px 64px; background: var(--paper); border-radius: 24px; }
  .card { max-width: 660px; }
  .crumb { display: none; }
  .imp { display: inline-flex; margin-bottom: 14px; padding: 4px 12px; border-radius: 999px; font-size: 13px; border: 1px solid var(--line); color: var(--soft); }
  .imp .why-l { display: none; } .imp b { font-weight: 500; }
  .imp.careful { color: var(--lime); border-color: var(--lime-line); }
  .imp.check, .imp.skim { display: none; }
  .title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin: 0 0 14px; }
  .card h2 { font-family: var(--display); font-weight: 700; font-size: 28px; line-height: 1.25; letter-spacing: -.03em; margin: 0; }
  #explore { font-size: 14px; padding: 6px 14px; min-height: 0; flex-shrink: 0; }
  .card .body { font-size: 17px; color: var(--soft); max-width: 62ch; margin: 0; white-space: pre-line; }
  .card .body code, .opt code, .why code, .msg .text code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .88em; background: var(--chip); padding: 1px 6px; border-radius: 6px; }
  .opts { list-style: none; padding: 0; margin: 28px 0 0; display: grid; gap: 10px; }
  .opt { display: grid; grid-template-columns: 26px 1fr 22px; gap: 12px; align-items: start; padding: 16px 18px; border: 1px solid var(--line); border-radius: 18px; background: var(--card); cursor: pointer; transition: background 160ms, border-color 160ms; }
  .opt:hover { background: var(--card-hover); border-color: #3a3a42; }
  .opt .check { width: 22px; height: 22px; color: var(--lime); visibility: hidden; align-self: center; }
  .opt .check svg, .mark svg { display: block; width: 100%; height: 100%; }
  .opt .check path, .mark path { stroke: #0b0c0c; }
  .opt .k { font-family: var(--display); font-weight: 700; font-size: 15px; line-height: 1.6; color: var(--muted); }
  .opt.rec { border-color: #3a3a42; } .opt.rec .k { color: var(--blue); }
  .opt .tag { font-size: 13px; color: var(--blue); margin-bottom: 2px; }
  .opt.lean .k, .opt.lean .tag { color: var(--blue); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; }
  .chip { font-size: 12.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .chip.g::before { background: var(--lime); } .chip.x::before { background: var(--muted); } .chip.p::before { background: var(--poor); }
  .opt.chosen { border-color: var(--lime); background: var(--lime-soft); } .opt.chosen .k { color: var(--lime); } .opt.chosen .check { visibility: visible; }
  .card.picked .body, .card.picked .why, .card.picked .note-taste, .card.picked .answer-row, .card.picked .links, .card.picked .opt:not(.chosen):not(.staged):not(.pending) { opacity: .45; transition: opacity .15s; }
  .card.picked .opt:not(.chosen):not(.staged):not(.pending):hover, .card.picked .answer-row:focus-within, .card.picked .links:hover { opacity: 1; }
  .opt.text-answer { cursor: default; } .opt.text-answer .tag { color: var(--lime); }
  .opt.staged { border-color: var(--lime); background: var(--lime-soft); } .opt.staged .k { color: var(--lime); }
  .opt.pending { border-color: var(--lime-line); border-style: dashed; } .opt .check.pending { visibility: visible; color: var(--lime); display: flex; align-items: center; justify-content: center; }
  .locked .opt { cursor: default; } .locked .opt:hover { background: var(--card); border-color: var(--line); }
  .multi-hint { margin: 20px 0 0; font-size: 14px; color: var(--muted); }
  .multi-hint + .opts { margin-top: 10px; }
  .why { margin: 18px 0 0; font-size: 15px; color: var(--soft); white-space: pre-line; } .why b { color: var(--text); font-weight: 600; }
  .note-taste { display: none; }
  .staged-line, .pending-line { display: none; }
  .answer-row { display: flex; gap: 10px; margin-top: 24px; align-items: flex-start; }
  .links { margin-top: 12px; font-size: 14px; display: flex; gap: 16px; } .links a { color: var(--muted); text-decoration: none; } .links a:hover { color: var(--text); }
  textarea { width: 100%; min-height: 52px; font: inherit; font-size: 15px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: transparent; resize: vertical; color: var(--text); }
  textarea::placeholder { color: var(--muted); }
  textarea:focus { outline: none; border-color: #55555e; }
  button { font-family: var(--sans); font-weight: 600; font-size: 15px; min-height: 44px; padding: 10px 20px; border-radius: 999px; border: 1px solid #3a3a42; background: transparent; color: var(--text); cursor: pointer; white-space: nowrap; transition: background 160ms, border-color 160ms; }
  button:hover { background: var(--chip); border-color: #55555e; }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--lime); outline-offset: 3px; }
  button.primary { background: var(--lime); border-color: var(--lime); color: #0b0c0c; } button.primary:hover { background: var(--lime-hover); border-color: var(--lime-hover); }
  button:disabled, button.primary:disabled { background: var(--chip); border-color: var(--chip); color: var(--muted); cursor: default; }
  main .empty { color: var(--muted); font-size: 15px; }

  aside { grid-row: 3; grid-column: 3; display: grid; grid-template-rows: auto 1fr auto; min-height: 0; }
  aside .head { padding: 18px 24px 8px; }
  aside .head h3, aside .head .count { display: none; }
  aside .head .sub { font-size: 14px; color: var(--muted); }
  aside .msgs { overflow-y: auto; padding: 0 24px 12px; }
  .msg { padding: 14px 0; border-top: 1px solid var(--line); position: relative; }
  .msg .who { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .msg.agent .who { color: var(--blue); }
  .msg.staged { background: var(--card); margin: 8px -12px 0; padding: 12px 32px 12px 12px; border-radius: 14px; border-top: 0; }
  .msg.pending { opacity: .7; } .msg.pending .who { display: flex; align-items: center; gap: 6px; }
  .msg .text { font-size: 15px; color: var(--soft); white-space: pre-line; }
  .msg .rm { position: absolute; right: 10px; top: 10px; color: var(--muted); text-decoration: none; }
  .empty-thread { display: none; }
  .explore-head { padding: 14px 0 6px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); }
  .explore-wait { padding: 14px 0; font-size: 14px; color: var(--blue); border-top: 1px solid var(--line); }
  .procon { width: 100%; border-collapse: collapse; font-size: 14px; margin: 2px 0 10px; color: var(--soft); }
  .procon th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 500; padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line); }
  .procon td { vertical-align: top; padding: 8px 8px 8px 0; border-bottom: 1px solid var(--line); }
  .procon td.k { font-family: var(--display); font-weight: 700; color: var(--muted); width: 28px; } .procon td.k.rec { color: var(--blue); }
  .procon ul { margin: 0; padding-left: 16px; } .procon li { margin: 0 0 3px; }
  .procon .pro li::marker { color: var(--lime); } .procon .con li::marker { color: var(--poor); }
  aside .compose { padding: 12px 24px 20px; display: grid; gap: 10px; } aside .compose button { justify-self: end; }

  footer { grid-row: 4; grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 16px 28px; }
  footer .staged-list { font-size: 14px; color: var(--muted); flex: 1; } footer .staged-list b { color: var(--text); font-weight: 500; } footer .staged-list .sent { display: inline-flex; align-items: center; gap: 6px; }
  footer .hint { display: none; } footer .warn { font-size: 13px; color: var(--warn); }
  footer .confirm { font-size: 14px; color: var(--soft); display: flex; gap: 10px; align-items: center; }
  #finish.ready, #finish-yes.ready { background: var(--lime); border-color: var(--lime); color: #0b0c0c; }
  #finish .spin { margin-right: 4px; }

  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; grid-template-rows: none; height: auto; min-height: 100vh; }
    #banner, header, nav, main, #visual, aside, footer { grid-column: 1 / -1; grid-row: auto; }
    header { flex-wrap: wrap; gap: 8px 12px; padding: 14px 16px; }
    header h1 { font-size: 16px; flex-basis: 100%; }
    header .status { margin-left: 0; }
    nav { max-height: 24vh; }
    main { overflow-y: visible; padding: 24px 16px 28px; border-radius: 20px; }
    .card h2 { font-size: 22px; }
    .opt { padding: 14px; gap: 10px; }
    aside { grid-template-rows: auto auto auto; }
    aside .msgs { overflow-y: visible; }
    footer { position: sticky; bottom: 0; z-index: 4; flex-wrap: wrap; gap: 8px 12px; padding: 12px 16px; background: var(--page); }
    #terms { left: 12px; right: 12px; width: auto; max-height: 50vh; }
    #visual { height: 78vh; margin: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    .spin { animation: pulse 1.6s ease-in-out infinite !important; border-right-color: currentColor !important; }
    #progress::after { animation: pulse 1.6s ease-in-out infinite !important; left: 0 !important; width: 100% !important; }
    .dot.working { animation-duration: 2.4s !important; animation-iteration-count: infinite !important; }
  }
</style>
</head>
<body>
<div id="banner"></div>
<header>
  <h1 id="topic">grill</h1>
  <span class="path" id="doc-path"></span>
  <span id="intent"></span>
  <button id="levels-toggle" type="button" hidden></button>
  <div id="levels"></div>
  <button id="terms-toggle" type="button">Термины</button>
  <div id="terms"></div>
  <button id="visualize" type="button" hidden>Прототип</button>
  <span id="subagent-opt" hidden><input type="checkbox" id="use-subagent" checked><label for="use-subagent">Субагент</label></span>
  <span class="status"><span class="dot" id="agent-dot"></span><span id="agent-status">подключаюсь…</span></span>
  <button id="theme-toggle" type="button" data-mode="system">
    <svg class="i-system" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.7a6.3 6.3 0 0 1 0 12.6z" fill="currentColor"/></svg>
    <svg class="i-light" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.5"/><g stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 1v1.8M8 13.2V15M1 8h1.8M13.2 8H15M3 3l1.3 1.3M11.7 11.7L13 13M13 3l-1.3 1.3M4.3 11.7L3 13"/></g></svg>
    <svg class="i-dark" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 9.5A6 6 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
  </button>
  <div id="progress"></div>
</header>
<nav id="nav"><div class="empty">Подключаюсь…</div></nav>
<main id="main"></main>
<section id="visual"><div id="visual-strip"></div><div id="visual-wait" hidden><span class="spin"></span>Рисую прототип…</div><iframe id="visual-frame" title="Прототип" sandbox="allow-scripts"></iframe></section>
<aside id="aside"></aside>
<footer>
  <span class="staged-list" id="staged-list"></span>
  <span class="warn" id="send-why"></span>
  <span class="hint"></span>
  <span id="finish-area"></span>
  <button class="primary" id="send" type="button" disabled>Отправить</button>
</footer>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// ---- markdown BEGIN ----
// Minimal markdown. Keep in sync with markdown.mjs.
// Escape first, then inline code, bold, italic, and safe links only.
const formatInline = (text) => text
  .replace(/\*\*(?!\s)([^*]+?)(?<!\s)\*\*/g, (_, b) => `<strong>${b}</strong>`)
  .replace(/(?<!\*)\*(?!\s)([^*]+?)(?<!\s)\*(?!\*)/g, (_, i) => `<em>${i}</em>`)
  .replace(/(^|\W)_([^_]+?)_(\W|$)/g, (_, pre, i, post) => `${pre}<em>${i}</em>${post}`);
const isSafeMdUrl = (url) => /^https?:\/\/[^\s"'<>]+$/.test(url); // absolute http(s) only
const md = (s) => {
  const codes = [];
  const noCode = esc(s).replace(/`([^`\n]+?)`/g, (_, code) => {
    codes.push(`<code>${code}</code>`);
    return `\0CODE${codes.length - 1}\0`;
  });
  const links = [];
  const withLinks = noCode.replace(/\[([^\]]+?)\]\(([^)\s]+?)\)/g, (m, label, url) => {
    if (!isSafeMdUrl(url)) return m;
    links.push(`<a href="${url}" target="_blank" rel="noopener noreferrer">${formatInline(label)}</a>`);
    return `\0LINK${links.length - 1}\0`;
  });
  const formatted = formatInline(withLinks);
  return formatted
    .replace(/\0LINK(\d+)\0/g, (m, n) => links[Number(n)] ?? m)
    .replace(/\0CODE(\d+)\0/g, (m, n) => codes[Number(n)] ?? m);
};
// ---- markdown END ----
const WORKING_GRACE_MS = 5 * 60 * 1000;
const DRAW_GRACE_MS = 10 * 60 * 1000; // a background draw older than this is treated as stuck: Regenerate comes back
const DRAW_STUCK_NOTE = "Прототип рисуется дольше 10 минут — попробуйте обновить.";
const GONE_AFTER_MS = 3000;
const CHECK = '<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="10" fill="currentColor"/><path d="M6 10.4l2.6 2.6L14 7.4" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
// LAN mode mints a per-serve token and puts it in the page URL (?t=...). The
// page carries it on every fetch so a LAN socket that requires it keeps working;
// on loopback there is no token and the paths stay exactly as before.
const LAN_TOKEN = new URLSearchParams(location.search).get("t") || "";
const withToken = (p) => LAN_TOKEN ? p + (p.includes("?") ? "&" : "?") + "t=" + encodeURIComponent(LAN_TOKEN) : p;

let S = null, raw = null, selected = null, storeKey = null;
let lastOk = Date.now(), gone = false, confirmFinish = false, intentOpen = false;
// GET /listener: has an agent shown a sign of life lately? null until known, and an unknown
// listener counts as listening, so the page never warns on a guess.
let listener = null;
let local = fresh();
function fresh() { return { staged: {}, pending: [], drafts: {}, view: "questions", vfeedback: [], subagent: true }; }
function load() { local = fresh(); try { const v = localStorage.getItem(storeKey); if (v) local = Object.assign(fresh(), JSON.parse(v)); } catch {} }
function save() { try { localStorage.setItem(storeKey, JSON.stringify(local)); } catch {} }

// ---- data helpers ----
const qs = () => (S && Array.isArray(S.questions) ? S.questions : []);
const byId = (id) => qs().find((q) => q.id === id);
const isOpen = (q) => q.status === "open" || q.status === "reopened";
const curRound = () => qs().reduce((m, q) => Math.max(m, Number(q.round) || 0), 0);
const rounds = () => { const m = new Map(); for (const q of qs()) { const r = Number(q.round) || 0; if (!m.has(r)) m.set(r, []); m.get(r).push(q); } return [...m.entries()].sort((a, b) => a[0] - b[0]).map(([r, list]) => [r, byLevel(list)]); };
const firstOpen = () => {
  const all = rounds();
  return all.find(([r]) => r === curRound())?.[1].find(isOpen) || all.flatMap(([, list]) => list).find(isOpen) || qs()[qs().length - 1] || null;
};
// Importance levels: how much attention a question deserves. Within a round the list sorts where

    return `<li class="opt${isRec ? (yours ? " lean" : " rec") : ""}${chosen ? " chosen" : ""}${staged ? " staged" : ""}${pending ? " pending" : ""}" data-opt="${esc(o.k)}"><span class="k">${esc(o.k)}</span><span>${isRec ? `<div class="tag">${yours ? "Мне ближе" : "Советую"}</div>` : ""}${md(o.text)}${yours ? "" : chipRow(o)}</span>${pending ? `<span class="check pending"><span class="spin"></span></span>` : `<span class="check">${CHECK}</span>`}</li>`;
  }).join("") + (q.status === "answered" && q.answer && q.answer.kind === "text" && q.answer.text
    ? `<li class="opt chosen text-answer"><span class="k"></span><span><div class="tag">Ваш ответ</div>${md(q.answer.text)}</span><span class="check">${CHECK}</span></li>` : "")
    + (pendAnswer && pendAnswer.kind === "text" && pendAnswer.text
    ? `<li class="opt pending text-answer"><span class="k"></span><span><div class="tag">Ваш ответ · отправляю</div>${md(pendAnswer.text)}</span><span class="check pending"><span class="spin"></span></span></li>` : "");
  const why = recKeys(q).length && yours ? `<p class="why lean"><b>Мне ближе ${esc(keyLabel(rec))}.</b> ${md(rec.why)}</p>`
    : recKeys(q).length ? `<p class="why"><b>Почему ${esc(keyLabel(rec))}.</b> ${md(rec.why)}</p>`
    : rec.text ? `<p class="why"><b>Совет.</b> ${md(rec.text)}${rec.why ? " — " + md(rec.why) : ""}</p>` : rec.why ? `<p class="why">${md(rec.why)}</p>` : "";
  let stagedLine = "";
  if (s.defer) stagedLine = "Staged: defer this question";
  else if (s.reopen) stagedLine = "Staged: reopen this question";
  else if (s.answer) stagedLine = s.answer.kind === "accept" ? `Staged: accept ${esc(keyLabel(s.answer))}` : keysOf(s.answer).length > 1 ? `Staged: options ${esc(keyLabel(s.answer))}` : keysOf(s.answer).length ? `Staged: option ${esc(keyLabel(s.answer))}` : `Staged text: “${esc(s.answer.text)}”`;
  if (stagedLine) stagedLine = `<div class="staged-line">${stagedLine}<a href="#" id="clear-staged">clear</a></div>`;
  const pendBits = pend.filter((a) => a.type === "defer" || a.type === "reopen").map((a) => a.type);
  if (pendBits.length) stagedLine += `<div class="pending-line"><span class="spin"></span>Sent: ${pendBits.join(", ")} this question · waiting for the agent</div>`;
  const controls = lk ? "" : `
      <div class="answer-row">
        <textarea id="free" placeholder="${q.status === "answered" ? "Изменить ответ…" : (q.options || []).length ? "Свой вариант…" : "Ваш ответ…"}">${esc(d.free || "")}</textarea>
        <button id="stage-text" type="button">Ответить</button>
      </div>
      <div class="links">${isMulti(q) && recKeys(q).length > 1 ? `<a href="#" id="accept-rec">Принять совет ${esc(keyLabel(rec))}</a>` : ""}${isOpen(q) ? `<a href="#" id="defer">Отложить</a>` : `<a href="#" id="reopen">Вернуться к вопросу</a>`}</div>`;
  const exploring = isExploring(q.id);
  const gate = sendState(false);
  const exploreBtn = (q.options || []).length && !lk
    ? `<button id="explore" type="button"${exploring || gate.disabled ? " disabled" : ""}${gate.disabled && gate.why ? ` title="${esc(gate.why)}"` : ""}>${exploring ? `<span class="spin"></span> Разбираю…` : q.explore ? "Ещё раз" : "Плюсы и минусы"}</button>` : "";
  const picked = (q.status === "answered" && q.answer) || !!s.answer || !!pendAnswer;
  main.innerHTML = `<article class="card${lk ? " locked" : ""}${picked ? " picked" : ""}">
      <div class="crumb">${crumb.join("")}</div>
      ${pill}
      <div class="title-row"><h2>${esc(q.title)}</h2>${exploreBtn}</div>
      <p class="body">${md(q.body)}</p>
      ${opts && isMulti(q) ? `<p class="multi-hint">Можно несколько</p>` : ""}
      ${opts ? `<ul class="opts">${opts}</ul>` : ""}
      ${why}${stagedLine}${controls}
    </article>`;
  main.querySelectorAll("[data-go]").forEach((a) => (a.onclick = (e) => { e.preventDefault(); if (byId(a.dataset.go)) { selected = a.dataset.go; render(); } }));
  if (lk) return;
  main.querySelectorAll(".opt:not(.text-answer)").forEach((o) => (o.onclick = (e) => { if (e.target.closest("a")) return; if (isMulti(q)) toggleOption(q, o.dataset.opt); else stageAnswer(q.id, { kind: o.dataset.opt === rec.option ? "accept" : "option", option: o.dataset.opt }); }));
  const ar = $("accept-rec"); if (ar) ar.onclick = (e) => { e.preventDefault(); stageKeys(q, recKeys(q)); };
  const ex = $("explore"); if (ex) ex.onclick = () => explore(q.id);
  $("stage-text").onclick = () => { const t = $("free").value.trim(); if (t) { (local.drafts[q.id] = local.drafts[q.id] || {}).free = ""; stageAnswer(q.id, { kind: "text", text: t }); } };
  $("free").oninput = (e) => { (local.drafts[q.id] = local.drafts[q.id] || {}).free = e.target.value; save(); renderFooter(); };
  const cl = $("clear-staged"); if (cl) cl.onclick = (e) => { e.preventDefault(); clearStaged(q.id); };
  const df = $("defer"); if (df) df.onclick = (e) => { e.preventDefault(); stageDefer(q.id); };
  const ro = $("reopen"); if (ro) ro.onclick = (e) => { e.preventDefault(); stageReopen(q.id); };
}
function renderAside() {
  const aside = $("aside");
  if (activeView() === "visualize") return renderFeedback(aside);
  const q = byId(selected);
  if (!q) { aside.innerHTML = ""; return; }
  const s = local.staged[q.id] || {}; const lk = locked(); const d = local.drafts[q.id] || {};
  const thread = Array.isArray(q.thread) ? q.thread : [];
  const msgs = thread.map((m) => `<div class="msg ${m.who === "agent" ? "agent" : "user"}"><div class="who">${m.who === "agent" ? "агент" : "вы"}</div><div class="text">${md(m.text)}</div></div>`).join("")
    + pendingActions(q.id).filter((a) => a.type === "thread").map((a) => `<div class="msg user pending"><div class="who"><span class="spin"></span>вы</div><div class="text">${md(a.text)}</div></div>`).join("")
    + (s.thread || []).map((t, i) => `<div class="msg user staged"><div class="who">вы · не отправлено</div><div class="text">${md(t)}</div>${lk ? "" : `<a href="#" class="rm" data-rm="${i}" title="Убрать">×</a>`}</div>`).join("");
  const rec = q.rec || {};
  let explore = "";
  if (q.explore && Array.isArray(q.explore.rows) && q.explore.rows.length) {
    const li = (xs) => `<ul>${(Array.isArray(xs) ? xs : []).map((x) => `<li>${md(x)}</li>`).join("")}</ul>`;
    explore = `<div class="explore-head">Плюсы и минусы</div>
      <table class="procon"><thead><tr><th></th><th>Плюсы</th><th>Минусы</th></tr></thead><tbody>${q.explore.rows.map((r) =>
        `<tr><td class="k${recKeys(q).includes(r.option) ? " rec" : ""}">${esc(r.option)}</td><td class="pro">${li(r.pros)}</td><td class="con">${li(r.cons)}</td></tr>`).join("")}</tbody></table>`;
  }
  if (isExploring(q.id)) explore += `<div class="explore-wait"><span class="spin"></span> Агент собирает плюсы и минусы…</div>`;
  aside.innerHTML = `
    <div class="head"><h3></h3><div class="sub">Обсуждение</div></div>
    <div class="msgs">${explore}${msgs || (explore ? "" : `<div class="empty-thread"></div>`)}</div>
    ${lk ? "" : `<div class="compose"><textarea id="thread-in" placeholder="Спросить про этот вопрос…">${esc(d.thread || "")}</textarea><button id="stage-thread" type="button">Добавить</button></div>`}`;
  aside.querySelectorAll("[data-rm]").forEach((a) => (a.onclick = (e) => { e.preventDefault(); removeThread(q.id, Number(a.dataset.rm)); }));
  if (lk) return;
  $("stage-thread").onclick = () => { const t = $("thread-in").value.trim(); if (t) stageThread(q.id, t); };
  $("thread-in").oninput = (e) => { (local.drafts[q.id] = local.drafts[q.id] || {}).thread = e.target.value; save(); renderFooter(); };
}
function renderFeedback(aside) {
  const v = visual(); const lk = locked(); const d = local.drafts.__visual || {};
  const thread = Array.isArray(v.thread) ? v.thread : [];
  const msgs = thread.map((m) => `<div class="msg ${m.who === "agent" ? "agent" : "user"}"><div class="who">${m.who === "agent" ? "агент" : "вы"}</div><div class="text">${md(m.text)}</div></div>`).join("")
    + pendingOfType("visual-feedback").map((a) => `<div class="msg user pending"><div class="who"><span class="spin"></span>вы</div><div class="text">${md(a.text)}</div></div>`).join("")
    + local.vfeedback.map((t, i) => `<div class="msg user staged"><div class="who">вы · не отправлено</div><div class="text">${md(t)}</div>${lk ? "" : `<a href="#" class="rm" data-rmf="${i}" title="Убрать">×</a>`}</div>`).join("");
  aside.innerHTML = `
    <div class="head"><h3></h3><div class="sub">Правки к прототипу</div></div>
    <div class="msgs">${msgs || `<div class="empty-thread"></div>`}</div>
    ${lk ? "" : `<div class="compose"><textarea id="feedback-in" placeholder="Что поправить…">${esc(d.thread || "")}</textarea><button id="stage-feedback" type="button">Добавить</button></div>`}`;
  aside.querySelectorAll("[data-rmf]").forEach((a) => (a.onclick = (e) => { e.preventDefault(); removeFeedback(Number(a.dataset.rmf)); }));
  if (lk) return;
  $("stage-feedback").onclick = () => { const t = $("feedback-in").value.trim(); if (t) stageFeedback(t); };
  $("feedback-in").oninput = (e) => { (local.drafts.__visual = local.drafts.__visual || {}).thread = e.target.value; save(); renderFooter(); };
}
function renderFooter() {
  const n = stagedCount(); const list = $("staged-list");
  const parts = Object.entries(local.staged).map(([id, s]) => {
    const bits = [];
    if (s.reopen) bits.push("reopen"); if (s.defer) bits.push("defer");
    if (s.answer) bits.push(keysOf(s.answer).length ? "→ " + keyLabel(s.answer) : "→ text");
    if (s.thread && s.thread.length) bits.push(`+${s.thread.length} msg`);
    return `${esc(id).toUpperCase()} ${bits.join(" ")}`;
  });
  if (local.vfeedback.length) parts.push(`visual +${local.vfeedback.length} msg`);
  for (const { id } of typedNotes()) parts.push(`${id === "__visual" ? "visual" : esc(id).toUpperCase()} +1 msg typed`);
  const lp = lastPending();
  const sent = !lp ? "" : unheard() ? `<span class="sent">сохранено · напишите агенту в чат: <b>грил</b></span>`
    : `<span class="sent"><span class="spin"></span>отправлено</span>`;
  const loose = typedAnswers().map((id) => esc(id).toUpperCase());
  const note = loose.length ? ` <span class="warn" id="unstaged-note">Свой вариант не добавлен — нажмите «Ответить».</span>` : "";
  list.innerHTML = locked() ? "Грил завершён." : (n ? `<b>Готово к отправке: ${n}</b>${sent ? " · " + sent : ""}` : sent || "") + note;
  const fa = $("finish-area");
  if (locked()) fa.innerHTML = "";
  else if (isFinishing()) fa.innerHTML = `<button id="finish" type="button" disabled><span class="spin"></span>Завершаю…</button>`;
  else if (confirmFinish) fa.innerHTML = `<span class="confirm">Завершить и собрать итог? <button id="finish-yes" class="ready" type="button">Завершить</button><button id="finish-no" type="button">Отмена</button></span>`;
  else {
    const a = (S && S.agent) || {}; const gate = sendState(false);
    const ready = allSettled() && a.status !== "working" && !lp && !gone;
    fa.innerHTML = `<button id="finish" type="button" class="${ready ? "ready" : ""}"${gate.disabled ? " disabled" : ""}${gate.disabled && gate.why ? ` title="${esc(gate.why)}"` : ""}>Завершить</button>`;
  }
  const f = $("finish"); if (f && !f.disabled) f.onclick = () => { confirmFinish = true; render(); };
  const fy = $("finish-yes"); if (fy) fy.onclick = finishNow;
  const fn = $("finish-no"); if (fn) fn.onclick = () => { confirmFinish = false; render(); };
  renderSend();
}
function renderSend() {
  const { disabled, why } = sendState(); const n = stagedCount(); const b = $("send");
  b.disabled = disabled; b.textContent = n ? `Отправить · ${n}` : "Отправить";
  $("send-why").textContent = why;
}

$("send").onclick = send;
$("intent").onclick = () => { if ($("intent").classList.contains("show")) { intentOpen = !intentOpen; render(); } };
$("use-subagent").onchange = (e) => { local.subagent = e.target.checked; commit(); };
$("visualize").onclick = () => { if (hasVisual()) { local.view = activeView() === "visualize" ? "questions" : "visualize"; commit(); } else visualize(); };
$("terms-toggle").onclick = () => { $("levels").classList.remove("show"); $("terms").classList.toggle("show"); };
$("levels-toggle").onclick = () => { $("terms").classList.remove("show"); $("levels").classList.toggle("show"); };
// ---- theme: data-theme forces light/dark; "system" follows the OS via light-dark() ----
const THEMES = ["system", "light", "dark"];
let theme = document.documentElement.dataset.theme || "system";
const applyTheme = () => {
  document.documentElement.dataset.theme = theme;
  const b = $("theme-toggle");
  b.dataset.mode = theme;
  b.title = b.ariaLabel = `Theme: ${theme} — click to change`;
};
$("theme-toggle").onclick = () => {
  theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
  applyTheme();
  fetch(withToken("/theme"), { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ theme }) }).catch(() => {});
};
applyTheme();
document.addEventListener("click", (e) => {
  if (!e.target.closest("#terms") && !e.target.closest("#terms-toggle")) $("terms").classList.remove("show");
  if (!e.target.closest("#levels") && !e.target.closest("#levels-toggle")) $("levels").classList.remove("show");
});
document.addEventListener("keydown", (e) => {
  if (!((e.metaKey || e.ctrlKey) && e.key === "Enter")) return;
  // First press in a compose box stages the draft so a second press can send it.
  if (!locked()) {
    const act = document.activeElement;
    const t = act && typeof act.value === "string" ? act.value.trim() : "";
    if (t) {
      if (act.id === "thread-in") { const q = byId(selected); if (q) { e.preventDefault(); stageThread(q.id, t); return; } }
      if (act.id === "free") { const q = byId(selected); if (q) { e.preventDefault(); (local.drafts[q.id] = local.drafts[q.id] || {}).free = ""; stageAnswer(q.id, { kind: "text", text: t }); return; } }
      if (act.id === "feedback-in") { e.preventDefault(); stageFeedback(t); return; }
    }
  }
  send();
});
poll();
</script>
